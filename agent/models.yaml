# OpenRouter model ids per profile and role. This is the only place model ids live.
# At startup the agent uses the first id in each list that OpenRouter reports as available.
#
# free profile: every id ends with ":free". `theoretical_price_from` names the paid twin
#   whose pricing is used to compute theoretical_cost_usd.
# writer and evaluator must come from different model families (provider prefix).
# judge: evals only, one fixed paid model that is never the writer under test.

base_url: https://openrouter.ai/api/v1

profiles:
  free:
    guard:
      - id: nvidia/nemotron-3.5-lightning:free
        theoretical_price_from: nvidia/nemotron-3.5-lightning
      - id: google/gemma-4-31b-it:free
        theoretical_price_from: google/gemma-4-31b-it
      - id: google/gemma-4-26b-a4b-it:free
        theoretical_price_from: google/gemma-4-26b-a4b-it
    writer:
      - id: google/gemma-4-31b-it:free
        theoretical_price_from: google/gemma-4-31b-it
      - id: google/gemma-4-26b-a4b-it:free
        theoretical_price_from: google/gemma-4-26b-a4b-it
    evaluator:
      - id: nvidia/nemotron-3-ultra-550b-a55b:free
        theoretical_price_from: nvidia/nemotron-3-ultra-550b-a55b
      - id: nvidia/nemotron-3.5-super-vl:free
        theoretical_price_from: nvidia/nemotron-3.5-super-vl
    judge:
      - id: anthropic/claude-haiku-5.5

  paid:
    guard:
      - id: google/gemini-3.1-flash-lite
      - id: mistralai/mistral-small-3.2-24b-instruct
    writer:
      - id: google/gemini-3.1-flash-lite
      - id: google/gemini-2.5-flash-lite
    evaluator:
      - id: openai/gpt-5-mini
      - id: mistralai/mistral-small-3.2-24b-instruct
    judge:
      - id: anthropic/claude-haiku-5.5
