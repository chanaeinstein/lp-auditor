<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Copy top investors automatically</h1>
    <img src="hero.jpg" alt="Investor profiles side by side" width="800" height="450">
    <h2>How copy trading works</h2>
    <p>Choose an investor, set an amount, and every trade they make is copied to your account.</p>
    <h4>Fees</h4>
    <p>No management fees for copying.</p>
    <h1>Start copying today</h1>
    <form action="/signup" method="post">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required>
      <button type="submit">Start copying</button>
    </form>
  </main>
</body>
</html>
