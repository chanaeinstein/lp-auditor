<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open a Free Demo Trading Account Today</title>
  <meta name="description" content="Practice trading stocks and crypto with $100,000 in virtual money. No risk, no deposit, and you can switch to a real account anytime.">
  <link rel="canonical" href="https://example.com/demo-account">
  <meta property="og:title" content="Open a Free Demo Trading Account">
  <meta property="og:image" content="https://example.com/img/og-demo.jpg">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <a href="/"><img src="logo.svg" alt="Example Markets home" width="120" height="32"></a>
  </header>
  <main>
    <h1>Learn to trade with zero risk</h1>
    <img src="hero.jpg" alt="Trading dashboard on a phone" width="800" height="450">
    <h2>Why a demo account</h2>
    <p>Test strategies with virtual money before you invest real funds.</p>
    <h3>What you get</h3>
    <ul>
      <li>$100,000 in virtual funds</li>
      <li>Real market prices</li>
    </ul>
    <img src="chart.png" alt="Sample portfolio growth chart" width="600" height="300" loading="lazy">
    <h2>Get started</h2>
    <form action="/signup" method="post">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required>
      <label for="country">Country</label>
      <select id="country" name="country">
        <option>Israel</option>
        <option>United Kingdom</option>
      </select>
      <button type="submit">Open a demo account</button>
    </form>
    <p><a href="/terms" target="_blank" rel="noopener noreferrer">Read the demo account terms</a></p>
  </main>
</body>
</html>
